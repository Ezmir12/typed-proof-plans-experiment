# Copy to config.toml and adjust. config.toml is gitignored: never put secrets here.
# Secrets are supplied via environment variables (see api_key_env below).

[llm]
provider = "deepinfra"
model = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B"
base_url = "https://api.deepinfra.com/v1/openai"
# Name of the env var holding the API key. The key itself never lives in a file.
api_key_env = "DEEPINFRA_TOKEN"
timeout_s = 60.0
max_retries = 2

[kernel]
system = "lean4+mathlib"
env_hash = "mock-env-hash-0000"
# RPC/CLI endpoint for a real Lean backend. Empty means the in-process mock.
endpoint = ""

[store]
owner = "tpps-prototype"
backend = "mock"

[app]
log_level = "INFO"
# Pipeline extractor: llm (default) | demo (dev/demo-only keyword matcher) |
# hooks (caller-supplied extract_fn, e.g. in tests). Explicit hooks win anyway.
extractor = "llm"
# Checker-feedback re-prompts after the first rejected candidate.
extract_retries = 2
